name: build-and-push-ghcr

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Git ref to build (branch, tag, or commit SHA)'
        required: true
        default: '89f00b214b1cf7bf65d4839ffd3278b4c8dd493f'
      image_tag:
        description: 'Immutable image tag to publish'
        required: true
        default: '89f00b21'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: kubepi

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/${IMAGE_NAME}"
          short_sha="$(git rev-parse --short=8 HEAD)"
          immutable_tag="${{ inputs.image_tag }}"
          if [[ -z "${immutable_tag}" ]]; then
            immutable_tag="${short_sha}"
          fi
          {
            echo "image=${image}"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "source_short_sha=${short_sha}"
            echo "tags<<EOF"
            echo "${image}:${immutable_tag}"
            echo "${image}:master"
            echo "${image}:latest"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.source_sha }}
            org.opencontainers.image.title=KubePi
